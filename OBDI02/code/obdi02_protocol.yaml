identity_with_obdi01:
  LAWSPEC_DIFF_FROM_OBDI01: NONE
  CHEMOSTAT_DIFF_FROM_OBDI01: NONE
  COHESION_DIFF_FROM_OBDI01: NONE
  DOMAIN_SIZES_DIFF_FROM_OBDI01: NONE
  PRIMARY_ESTIMAND_DIFF_FROM_OBDI01: NONE
  PER_SEED_SUMMARY_DIFF_FROM_OBDI01: NONE
  PREPARATION_DIFF_FROM_OBDI01: NONE
  HORIZON_BURNIN_WINDOW_SAMPLING_DIFF_FROM_OBDI01: NONE
  TECHNICAL_VALIDITY_LAYER_DIFF_FROM_OBDI01: NONE
  EQUIVALENCE_MARGIN_DIFF_FROM_OBDI01: NONE
  EQUIVALENCE_INTERVAL_LEVEL_DIFF_FROM_OBDI01: NON_EMPTY
  what_changed_and_why: 'exactly one thing changed: the LEVEL of the interval. OBDI01 required a 99.49
    %% two-sided interval to lie inside the margin — a Sidak correction across ten tests, applied to an
    intersection-union equivalence claim that does not need it, on top of a variance floor. OBDI02 uses
    the interval a TOST at alpha = 0.05 actually calls for, the 90 %% two-sided one. The estimand, the
    margin, the per-seed summary, the sizes, the law, the preparation and the technical layer are all
    unchanged. §6 of the mandate provides for exactly this under OBDI01_EQUIVALENCE_METHOD = VALID_BUT_OVERCONSERVATIVE.'
  how_enforced: arms are produced by calling OBDI01's own run_one, which calls OBTC02's own run_arm, unmodified.
    Only L, the seed and the output directory differ.
primary_endpoint:
  name: RELATIVE_CORE_ORGANIZER_SCALE_EQUIVALENCE
  estimand: 'beta_CY : the slope of log d_CY on log L, where d_CY(L) is the arm-level median of |C - Y|
    divided by the operator''s exact finite-size prediction at that L'
  C_definition: 'the toroidal Frechet centre of the X field: the separable exact minimiser of the sum
    of squared toroidal distances, per axis, on a lattice site'
  Y_definition: the organiser cell, the unique cell with n_Y > 0
  metric: '|C - Y| = hypot(wdist1(dy, L), wdist1(dx, L)), the toroidal distance'
  independent_unit: SEED
  within_seed_summary: the MEDIAN of |C - Y| over the 180 in-window frames of the arm (steps strictly
    after the burn-in, one frame every SAMPLE_EVERY steps), where |C - Y| is the toroidal Euclidean distance
    between the Frechet centre of the X field and the organiser cell, both read from the same frame
  estimator: weighted least squares slope of y_L = mean_arms(log summary) - log(prediction_L) on log L,
    weights w_L = n_L / sd_L(log summary)^2
  null_hypothesis: 'H0 : |beta_CY| >= margin'
  alternative_hypothesis: 'H1 : |beta_CY| <  margin'
  method: 'TOST in confidence-interval form: the whole two-sided (1 - 2 alpha) interval for beta_CY must
    lie strictly inside +- margin'
  tost_alpha_one_sided: 0.05
  two_sided_interval_level: 90 %
  equivalence_margin: 0.25
  margin_provenance: '0.25, read out of OBDI01''s frozen protocol at principal_outcome.components.A_shape_invariance.margin.
    The figure 0.042 carried by the OBDI02 mandate is NOT a margin: it is the EXCESS of the OBDI01 interval
    over that margin (0.2918 - 0.2500 = 0.0418). Proof: under a margin of 0.042 the R_g and r80 components
    would also have failed, and OBDI01 reported them as passing. Adopting 0.25 is therefore not a widening
    — it restores the inherited value, and it is what makes EQUIVALENCE_MARGIN_DIFF_FROM_OBDI01 = NONE
    true.'
  stringent_reference_margin: 0.042
  stringent_reference_power: 0.314375
  stringent_reference_status: reported, never decisive. Its power at the frozen sample size is 0.314,
    and reaching 90 % would need about 200 arms per size, roughly 10.1 hours of engine time, far beyond
    the declared budget cap of 49 arms per size. It is therefore PRE-DECLARED UNDERPOWERED before any
    run.
  achieved_equivalence_bound: '|beta| + c se, reported as a number: the smallest margin at which this
    data set would have declared equivalence. This is the mission''s precision deliverable and is frozen
    as a REPORTED quantity, not as a test.'
  decision_rule: PASS if and only if the whole 90 % interval lies inside the margin. A point estimate
    near zero does not qualify. Excluding H_linear does not qualify. Excluding H_sublinear does not qualify.

secondary_endpoint:
  NAME: LEGACY_D_GATE
  definition: fraction of in-window frames with r80_organiser <= min(12.8, 0.35 L), required >= 0.95,
    per arm
  status: LOCKED — reported exactly as OBTC02 defined it, never retuned
  role: secondary. Its result on the new seeds is reported honestly whatever it is, and it cannot change
    the principal outcome in either direction.
  expected_under_H_bound: from §8, a false-negative rate of about 0.41 per arm at L=72 and above, rising
    with the number of frames; so a FAIL on some large-domain arms is the EXPECTED behaviour of this gate
    under a true H_bound and must not be read as evidence against boundedness
stopping:
  EARLY_SCIENTIFIC_STOPPING: FORBIDDEN
  rule: every planned arm is run. No arm may be skipped, repeated, replaced or reordered because of what
    an earlier arm showed.
  technical_abort_only: the run halts only if an arm is TECHNICALLY INVALID or if the two evaluators disagree
    — both are defects of the instrument, not results, and both are recorded as such
  budget:
    confirmation_arms_planned: 15
    hard_cap: 15

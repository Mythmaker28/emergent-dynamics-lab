  power_rule: smallest n per domain size giving >= 80 % power against H_linear at a family-wise level
    of 5 % under H_bound; if no n <= 20 achieves it, DOMAIN_TEST_UNDERPOWERED
  estimability_rule: the between-seed sd must itself be estimable with a relative standard error <= 40
    pct, i.e. 1/sqrt(2(n-1)) <= 0.40; this is a SEPARATE requirement, stated openly, because the power
    rule alone would allow n = 1

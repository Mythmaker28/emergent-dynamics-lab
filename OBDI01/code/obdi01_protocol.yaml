  sd_rule: the standard deviation used at each L is max(realised, pre-registered). Using the realised
    one alone would let an unusually tight sample widen the equivalence claim.
principal_outcome:
  NAME: DOMAIN_INVARIANCE_REGION
  form: a SIMULTANEOUS acceptance region; every component must hold
  arm_summary: median over the in-window frames, except density and winding
  multiplicity:
    K: 10
    family_alpha: 0.05
    correction: Sidak
    per_test_alpha: 0.005116196891823743
    critical_value_c: 2.799625219301098
    two_readings:
    - 'declaring invariance is an INTERSECTION-UNION claim: it requires every component to pass, so its
      level is the level of a single component and multiplicity does NOT inflate it'
    - failing the region when H_bound is true is a union event, and THAT is what the Sidak correction
      controls at 5 %
  components:
    A_shape_invariance:
      statistics:
      - Rg
      - r80
      - organiser_to_core
      construction: per arm y = log(observed) - log(predicted at that L); the predicted value already
        contains the exact periodic-image correction, so under H_bound y has NO trend in L, whatever L-independent
        bias the capacity cap introduces
      statistic: beta = weighted least squares slope of y on log L
      rule: accept iff |beta| + c * se(beta) <= margin
      margin: 0.25
      margin_justification: 0.25 is half the exponent of the SLOWEST unbounded alternative under consideration
        (H_sublinear, alpha = 0.5). Accepting therefore excludes every alternative in the family, not
        merely H_linear.
      predicted_beta_under:
        H_bound: 0.0
        H_sublinear: 0.5
        H_linear: 1.0
        H_fill: 1.0
    B_density_exponent:
      statistic: gamma = weighted least squares slope of log(N_X / L^2) on log L
      rule: accept iff |gamma + 2| + c * se(gamma) <= margin
      margin: 0.25
      predicted_gamma_under:
        H_bound: -2.0
        H_sublinear: -1.0
        H_fill: 0.0
      why: the population is NOT predicted by the operator — the birth rate is a measured local quantity
        — so its scaling is a genuine test and not a restatement of the profile
    C_no_true_winding:
      statistic: pooled fraction of in-window frames with a topological winding
      rule: accept iff the fraction <= tolerance at EVERY domain size
      tolerance: 0.01
      note: the exact kernel produced 0 windings in 3000 draws at every candidate L; the tolerance is
        far above that and still excludes H_fill, under which winding is typical
    D_profile_compatibility:
      statistic: total variation distance between the pooled empirical radial mass distribution about
        the organiser and the exact predicted radial distribution

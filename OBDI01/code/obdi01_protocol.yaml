hypotheses:
  H_bound:
    statement: the cloud has an intrinsic size fixed by the operator; as L grows the radius converges
      to its infinite-lattice value and the population stays constant, so the DENSITY falls as 1/L^2
    r_of_L: r(L) -> r_inf, with a computable finite-L correction from the periodic images; exponent alpha
      = d log r / d log L -> 0
    alpha: 0.0
    density_exponent: -2.0
    winding_frequency: -> 0 super-exponentially in L
    predicted_by: the frozen source-transport-decay operator, no free parameter
  H_linear:
    statement: 'the cloud is a fixed fraction of the domain: it has no intrinsic size and simply rescales
      with the box'
    r_of_L: r(L) = c L, alpha = 1
    alpha: 1.0
    density_exponent: 0.0
    winding_frequency: bounded away from 0
    predicted_by: 'none: it is the alternative the domain axis must exclude'
  H_sublinear:
    statement: the cloud grows without bound but more slowly than the box
    r_of_L: r(L) = c L^alpha with 0 < alpha < 1; the reference sub-case is the diffusive alpha = 1/2
    alpha: 0.5
    density_exponent: -1.0
    winding_frequency: -> 0 but only polynomially
    predicted_by: 'none: an unbounded-but-slower alternative'
  H_fill:
    statement: 'the cloud occupies the whole torus: the population scales with the area, the density is
      constant and winding becomes typical'
    r_of_L: r(L) -> the radius of a uniform distribution on the torus, alpha = 1
    alpha: 1.0
    density_exponent: 0.0
    winding_frequency: -> 1
    predicted_by: 'none: the failure mode the NO_GLOBAL_FILLING condition guards'

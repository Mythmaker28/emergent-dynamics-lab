  head: bb7fea748560ce8489d18ca64973f95e907ec382
  disposition: ORGANIZER_BOUND_CLOUD_PARTIAL
  METHODS_CORE_HASH: 747c1f5e68da95c7b63b81b09fcc531cc0dc7b0e13a3ceadb54d10103fc350f7
design_status:
  DESIGN_STATUS: OUTCOME_INFORMED_TARGETED_FOLLOWUP
  why: this mission exists because a specific axis of OBTC02 did not close. The DESIGN of the new outcome
    was chosen after seeing that result and is therefore outcome-informed; saying otherwise would be false.
  CONFIRMATORY_DATA_STATUS: FRESH_AND_PREREGISTERED
  why_data: every arm below is run on a seed disjoint from all earlier missions, after this file is frozen
    and its digest recorded. No OBTC02 arm contributes to the new principal outcome.
  consequence: an outcome-informed DESIGN evaluated on FRESH data supports a claim about the domain axis
    only; it does not upgrade OBTC02, and it does not license a claim that the whole qualification is
    now complete.
route:
  ROUTE: B
  definition: the legacy D gate stays a LOCKED SECONDARY endpoint. It is neither removed nor reinterpreted
    nor retuned. The new principal outcome measures the dependence on L directly.
  LEGACY_D_GATE_STATUS: MISALIGNED_WITH_DOMAIN_INVARIANCE
  grounds:
  - 'THRESHOLD_ESSENTIALLY_INDEPENDENT_OF_L: bound(36)=12.60, bound(72)=12.80, ratio 1.0159. Over the
    only two domain sizes used by OBTC02 the absolute term 12.8 is binding at L=36 (0.35*36=12.6) and
    binding at L=72 (0.35*72=25.2>12.8), so doubling L changes the admissible radius by 1.6%. The gate
    therefore tests an ABSOLUTE radius, not its dependence on L.'
  - 'NO_CROSS_DOMAIN_COMPARISON: RELATIVE_LOCALIZATION is evaluated inside a single arm and never forms
    a ratio, difference or regression across L. Domain invariance is a statement about how a quantity
    varies with L; a per-arm threshold cannot express it.'
  - 'REDUNDANT_WITH_P: the identical condition, identical statistic and identical binding threshold are
    already applied to the five passing P arms at L=36. The D arms add no new inferential content beyond
    re-running the same absolute test on a larger torus.'
  - 'HIGH_FALSE_NEGATIVE_RATE_AT_L=72: under data generated by the frozen LawSpec (so H-bound is true
    by construction) the gate fails with probability 0.407 at L=72 versus 0.030 at L=36. The asymmetry
    is not physical: it comes from the heavier upper tail of r80_organiser once periodic images stop truncating
    it.'
  - 'ANTI_CONSISTENCY_AT_L=72: as the number of frames grows the failure probability FALLS at L=36 (60
    -> 0.0623, 180 -> 0.0312, 540 -> 0.0043, 1800 -> 0.0001) but RISES at L=72 (60 -> 0.2992, 180 -> 0.4110,
    540 -> 0.5073, 1800 -> 0.6163). A well-posed test of a true hypothesis converges to acceptance. At
    L=72 the true frame-wise exceedance probability sits above the 5% budget, so more evidence makes rejection
    more certain: the criterion is anti-consistent there, and the amount of data — not the physics — decides
    the verdict.'
  - 'A_DIRECT_MEASURE_DISAGREES: the quantity the axis is about — the cloud-frame radius r80, measured
    from the cloud''s own centre and so free of the organiser-frame offset — has median-of-arm-medians
    7.0711 at L=36 and 7.0355 at L=72, a relative difference of 0.0050 (0.50%), while the legacy gate
    reports FAIL on two of three D arms.'
  rejected_routes:
    A: 'keep the legacy gate as the principal outcome. Rejected: §7 shows it does not measure domain invariance
      at all, so passing or failing it again would answer a different question.'
    C: 'declare the axis unclosable with the frozen engine. Rejected: §12-§14 show the operator makes
      sharp parameter-free predictions at every candidate L and that the design has ample power.'

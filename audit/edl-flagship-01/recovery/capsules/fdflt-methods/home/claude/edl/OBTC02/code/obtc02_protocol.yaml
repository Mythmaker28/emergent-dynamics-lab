    - 8101
    - 8102
    - 8103
    - 8104
    - 8105
    - 8106
    - 8201
    - 8202
    - 8203
    - 8301
    - 8302
    - 8303
    - 8401
    - 8402
    - 8501
    - 8502
    - 8503
  qualification_requires:
    P_arms_passing_all_per_arm_conditions: 5
    D_arms_passing: 2
    R_arms_showing_the_predicted_decay: 3
    N_arms_not_maintaining: 2
  seed_generation_rule: the OBTC02 families are the OBTC01 families with the leading digit advanced from
    8 to 9, condition by condition, preserving the arm counts exactly. The rule is frozen here, before
    any run, and produces a set provably disjoint from every seed used by MINCORE, MTW01, MCM01, ORR01,
    CSC01 and OBTC01.
sequential_rule:
- - run technically invalid
  - STOP
- - provenance not verified
  - STOP
- - gate certificate not PASS
  - STOP
- - winding test disagrees with the independent implementation
  - STOP
- - online and post hoc gates disagree anywhere
  - STOP
- - the legacy extent proxy enters any gate condition
  - STOP
- - the chemostat loses its exact occupancy balance in any arm
  - STOP
- - a required raw field is missing from any arm
  - STOP
- - the principal condition forms no cloud on the first two seeds
  - STOP
- - the larger domain shows a radius proportional to L
  - STOP
- - a control contradicts the mechanism
  - STOP
- - the start ledger diverges from the arm records
  - STOP
- - a bug is found after the results are opened
  - STOP and the disposition becomes AUDIT_INVALID
- - no manual resumption after a stop is permitted in this mission
  - ABSOLUTE
budget:
  caps:
    calibration: 4
    confirmation: 24
    control: 8
    cost_probe: 2
  non_scientific_classes:
  - cost_probe
replicates:
  mission: ORGANIZER-BOUND-TURNOVER-CLOUD-01
  frozen_spec_sha256: 4008a92bc73f440a84143ee12b7dedbe05950a6aebbcf0200cc4ab3a59de3091
  scientific_content: IDENTICAL. Only the seed families change, and a technical validity layer is ADDED.
    No threshold, formula, intervention, window, domain size, null or LawSpec is touched.
technical_validity:
  purpose: RUN_TECHNICALLY_VALID is evaluated BEFORE any scientific criterion. A technically invalid run
    consumes its start, counts as neither a scientific success nor a scientific failure, and fires the
    stop rule immediately.
  checks:
  - zero spatial frames received
  - frame count differs from the expected count
  - frame indices differ between stream and table
  - frame index checksum differs
  - duplicated frame
  - missing frame
  - indices not strictly increasing
  - online and post hoc disagree
  - a required raw field is absent
  - start counter inconsistent
  - temporal boundary error
  - run ended incomplete
  - RNG state absent
  - file corruption
  frame_transport_invariants:
  - EXPECTED_FRAME_COUNT
  - STREAM_FRAME_COUNT
  - TABLE_FRAME_COUNT
  - STREAM_FRAME_INDEX_SHA256
  - TABLE_FRAME_INDEX_SHA256
  - STREAM_SPATIAL_PAYLOAD_SHA256
  - TABLE_SPATIAL_PAYLOAD_SHA256
  frame_call_contract: online.frame() must be called exactly once per eligible frame, after the frame
    is fully built, before the index is updated, and with the same identifier as the saved row.
  third_boundary_convention: bucket(i) = min(2, i // (T_WINDOW // 3)) on the 0-based index of the post-burn-in
    step. This reproduces the array split n//3 EXACTLY for every horizon, not only for horizons divisible
    by three. The WRITTEN convention - three equal consecutive blocks - is unchanged.
